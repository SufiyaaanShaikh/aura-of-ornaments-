<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Sign In Page</title>
</head>

<body>
    <!-- form section starts  -->
    <div class="form">
        <div class="form-style">
            <div class="left">
                <div class="form-container">
                    <h1 class="title">Login</h1>

                    <form action="" id="signIn">
                        <input placeholder="Email" type="email" id="loginEmail" name="email" required="" class="input">

                        <input placeholder="Password" type="password" id="loginPassword" name="password" required=""
                            class="input">

                        <div class="forgot">
                            <a href="#" class="forgot">Forgot your password?</a>
                        </div>

                        <button type="submit">
                            Sign In
                        </button>

                    </form>
                    <div id="account">
                        <h4>Don't have an account?<a href="../form/sign_up.html">Create</a></h4>
                    </div>
                </div>
            </div>
            <div class="right">
            </div>
        </div>
    </div>
    <!-- form section ends  -->
    <script>
        document.getElementById("signIn").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            const requestBody = {
                email,
                password
            };

            try {
                const response = await fetch("http://localhost:5020/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody)
                });

                const { data } = await response.json();

                if (response.ok) {
                    alert("Login successful!");
                    localStorage.setItem("accessToken", data.accessToken); // Store token for authentication
                    localStorage.setItem("name", data.name);
                    localStorage.setItem("email", data.email);
                    localStorage.setItem("loggedIn", "true");
                    window.location.href = "../index.html"; // Redirect to dashboard or home page
                } else {
                    alert(data.message || "Login failed. Please check your credentials.");
                }
            } catch (error) {
                console.error("Error during login:", error);
                alert("An error occurred. Please try again later.");
            }
        });

    </script>
    <!-- <script src="../JavaScript/script.js"></script> -->
</body>

</html>
