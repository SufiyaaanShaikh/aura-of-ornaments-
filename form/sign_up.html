<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Sign Up Page</title>
</head>

<body>

    <!-- form section starts  -->
    <div class="form" >
        <div class="form-style">
            <div class="left">
                <div class="form-container">
                    <h1 class="title">Create Account</h1>
                    <form action="" id="signUp">
                        <input placeholder="Name" type="text" id="name" name="name" required="" class="input">

                        <input placeholder="Email" type="email" id="email" name="email" required="" class="input">

                        <input placeholder="Password" type="password" id="password" name="password" required=""
                            class="input">

                        <button type="submit">
                            Create
                        </button>

                    </form>
                    <div id="account">
                        <h4>Already have an account?<a href="../form/sign_in.html">Login</a></h4>
                    </div>
                </div>

            </div>
            <div class="right">
                <!-- <img src="../images/form-right.webp" alt=""> -->
            </div>
        </div>
    </div>
    <!-- form section ends  -->

    <script>
        document.getElementById("signUp").addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const requestBody = {
                name,
                email,
                password
            };

            try {
                const response = await fetch("http://localhost:5020/api/auth/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Account created successfully!");
                    window.location.href = "../form/sign_in.html"; // Redirect to login page
                } else {
                    alert(data.message || "Signup failed. Please try again.");
                }
            } catch (error) {
                console.error("Error during signup:", error);
                alert("An error occurred. Please try again later.");
            }
        });

    </script>

    <!-- <script src="../JavaScript/script.js"></script> -->
</body>


</html>
