<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Payment</title>
    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>
    <header>
        <div class="logo invert">
            <a href="../index.html">
                <img src="../images/logo.svg" alt="Logo">
            </a>
        </div>
        <div class="menu">
            <a href="../index.html">Home</a>
            <a href="../product.html">Product</a>
            <a href="../services.html">Services</a>
            <a href="../aboutUs.html">About Us</a>
            <a href="../contactUs.html">Contact Us</a>
        </div>

        <div class="icons invert">
            <div class="user-wrapper" id="userWrapper">
                <img src="../images/user.svg" alt="user" id="userIcon">
                <div class="dropdown" id="userDropdown">
                    <ul class="locations">
                        <li><a href="../form/sign_in.html" id="signInOption">Sign In</a></li>
                        <li><a href="../form/sign_up.html" id="signUpOption">Sign Up</a></li>
                        <li><a href="#" id="logout">Log Out</a></li>
                    </ul>
                    <span id="userNameDisplay"></span>
                </div>
            </div>
            <a href="wishlist.html"><img src="../images/wishlist.svg" alt="wishlist"></a>
            <a href="cart.html"><img src="../images/cart.svg" alt="cart"></a>
        </div>
    </header>
    
    <div id="payment-section">
        <div class="section-style">
            <div class="payment-border">
                <h1>Payment</h1>
                <div class="payment-container">
                    <div class="payment-options">
                        <h3>Select Payment Method</h3>
                        <div class="payment-methods">
                            <div class="payment-method active" data-method="stripe">
                                <img src="../images/stripe.png" alt="Stripe">
                                <span>Credit / Debit Card</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="order-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-items">
                            <!-- Order items will be dynamically loaded here -->
                        </div>
                        <div class="summary-totals">
                            <!-- Summary totals will be loaded here -->
                        </div>
                        <button id="checkout-button" class="checkout-btn">Pay Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/payment.js"></script>
</body>

</html>
