<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Shipping</title>
</head>

<body>
    <header>
        <div class="logo invert">
            <a href="../index.html">
                <img src="../images/logo.svg" alt="Logo">
            </a>
        </div>
        <div class="menu">
            <a href="../index.html">Home</a>
            <a href="../product.html">Product</a>
            <a href="../services.html">Services</a>
            <a href="../aboutUs.html">About Us</a>
            <a href="../contactUs.html">Contact Us</a>
        </div>

        <div class="icons invert">
            <div class="user-wrapper" id="userWrapper">
                <img src="../images/user.svg" alt="user" id="userIcon">
                <div class="dropdown" id="userDropdown">
                    <ul class="locations">
                        <li><a href="../form/sign_in.html" id="signInOption">Sign In</a></li>
                        <li><a href="../form/sign_up.html" id="signUpOption">Sign Up</a></li>
                        <li><a href="#" id="logout">Log Out</a></li>
                    </ul>
                    <span id="userNameDisplay"></span>
                </div>
            </div>
            <a href="wishlist.html"><img src="../images/wishlist.svg" alt="wishlist"></a>
            <a href="cart.html"><img src="../images/cart.svg" alt="cart"></a>
        </div>
    </header>
    
    <div id="shipping-section">
        <div class="section-style">
            <div class="shipping-border">
                <h1>Shipping Details</h1>
                <div class="shipping-container">
                    <div class="shipping-form-container">
                        <form id="shipping-form">
                            <div class="shipping-form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" required>
                            </div>
                            <div class="shipping-form-group">
                                <label for="phone">Phone Number</label>
                                <input type="text" id="phone" required>
                            </div>
                            <div class="shipping-form-group">
                                <label for="address">Address</label>
                                <input type="text" id="address" required>
                            </div>
                            <div class="shipping-form-group input-group">
                                <div class="input-box">
                                    <label for="city">City</label>
                                    <input type="text" id="city" name="city" required>
                                </div>
                                <div class="input-box">
                                    <label for="state">State</label>
                                    <input type="text" id="state" name="state" required>
                                </div>
                            </div>

                            <div class="shipping-form-group">
                                <label for="zip">ZIP Code</label>
                                <input type="text" id="zip" required>
                            </div>
                            <button type="submit" class="submit-btn">Proceed to Payment</button>
                        </form>
                    </div>
                    <div class="summary-container">
                        <!-- Order summary will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../JavaScript/script.js"></script>
    <script src="../JavaScript/shipping.js"></script>
</body>

</html>
